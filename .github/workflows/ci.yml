name: Baltic Limit Order Book CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Build Core Engine
        run: |
          cobc -free -x -Wall -Icopybooks src/lob_engine.cbl -o lob_engine

      - name: Execute Automated Test Suite
        run: |
          cobc -free -x -Wall -Icopybooks tests/lob_test.cbl -o lob_test && ./lob_test
